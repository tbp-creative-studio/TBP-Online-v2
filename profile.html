<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - TBP Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="padding-bottom: 50px;">
    <header>
      <div class="logo">TBP Online</div>
      <nav><a href="dashboard.html">Back to Dashboard</a></nav>
    </header>

    <main style="margin-top: 30px; display: flex; justify-content: center;">
      <div class="glass-card" style="width: 100%; max-width: 400px; padding: 25px; border-radius: 16px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(15, 23, 42, 0.8);">
        
        <div style="width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 50%; background: linear-gradient(135deg, #00f2fe, #4facfe); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #fff; box-shadow: 0 4px 15px rgba(0,242,254,0.3);" id="userAvatar">
          U
        </div>

        <h2 id="profileName" style="margin-bottom: 5px; color: #fff;">User Name</h2>
        <span id="profileVip" style="display: inline-block; background: linear-gradient(90deg, #ff8a00, #e52e71); color: #fff; padding: 3px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px;">VIP 0 (Free)</span>

        <div style="background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;">
          
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 0.9rem;">🆔 UID:</span>
            <strong id="profileUid" style="color: #00f2fe; font-family: monospace;">------</strong>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 0.9rem;">📱 Phone / Email:</span>
            <strong id="profileContact" style="color: #fff; font-size: 0.85rem;">-</strong>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 0.9rem;">💰 Balance:</span>
            <strong id="profileBalance" style="color: #28a745;">৳0.00</strong>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="color: var(--text-secondary); font-size: 0.9rem;">📅 Joined:</span>
            <strong id="profileJoined" style="color: #fff; font-size: 0.85rem;">-</strong>
          </div>

        </div>

        <button id="logoutBtn" class="btn" style="background: #dc3545; width: 100%; border-radius: 8px;">Logout</button>

      </div>
    </main>
  </div>

  <script type="module" src="profile.js"></script>
</body>
</html>
