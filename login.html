<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TBP Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 80px;">
    <div class="glass-card">
      <h2 style="text-align: center; margin-bottom: 20px;">Welcome Back</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required placeholder="******">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
      </form>
      <p style="text-align: center; margin-top: 15px; color: var(--text-secondary);">
        Don't have an account? <a href="register.html" style="color: var(--accent-cyan);">Register</a>
      </p>
    </div>
  </div>

  <!-- 🔥 ফাইলের নাম auth.js রাখা হয়েছে -->
  <script type="module" src="auth.js"></script>
</body>
</html>
