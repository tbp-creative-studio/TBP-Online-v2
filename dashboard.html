<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - TBP Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">TBP Online</div>
      <nav>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="tasks.html">Tasks</a>
        <a href="deposit.html">Deposit</a>
        <a href="withdraw.html">Withdraw</a>
        <a href="referral.html">Referral</a>
        <a href="profile.html">Profile</a>
        <button id="logoutBtn" class="btn" style="padding: 5px 12px; margin-left: 15px;">Logout</button>
      </nav>
    </header>

    <main style="margin-top: 30px;">
      <h2>Welcome, <span id="userName" style="color: var(--accent-cyan);">User</span> 👋</h2>
      
      <div class="grid-3" style="margin-top: 20px;">
        <div class="glass-card">
          <h4>Current Balance</h4>
          <h1 id="balance" style="margin-top: 10px; color: var(--accent-green);">৳0</h1>
        </div>
        <div class="glass-card">
          <h4>Total Earned</h4>
          <h1 id="totalIncome" style="margin-top: 10px;">৳0</h1>
        </div>
        <div class="glass-card">
          <h4>VIP Level</h4>
          <h1 id="vip" style="margin-top: 10px; color: var(--accent-cyan);">Free</h1>
        </div>
      </div>

      <div class="grid-3">
        <div class="glass-card">
          <p>Today Income: <b id="todayIncome">৳0</b></p>
          <p style="margin-top: 5px;">Total Referrals: <b id="referral">0</b></p>
        </div>
        <div class="glass-card">
          <p>Total Deposit: <b id="deposit">৳0</b></p>
          <p style="margin-top: 5px;">Total Withdraw: <b id="withdraw">৳0</b></p>
        </div>
        <div class="glass-card" style="display: flex; align-items: center;">
          <button id="dailyBonusBtn" class="btn" style="width: 100%;">Claim Daily Bonus (৳10)</button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
