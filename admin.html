<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - TBP Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">TBP Admin Panel</div>
      <nav><a href="dashboard.html">User Portal</a></nav>
    </header>
    <main style="margin-top: 30px;">
      <h3>Pending Deposits</h3>
      <div id="depositsList" style="margin-top: 15px;"></div>
      <section class="glass-card" style="margin-top: 20px;">
  <h3>Add New Task</h3>
  <form id="addTaskForm" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
    <input type="text" id="taskTitle" placeholder="Task Title (e.g. Watch Youtube Video)" required style="padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
    <input type="url" id="taskLink" placeholder="Task Work Link (https://...)" required style="padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
    <input type="number" id="taskReward" value="4" placeholder="Reward Amount (e.g. 4)" required style="padding: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
    <button type="submit" class="btn">Add Task</button>
  </form>
      </section>
      
    </main>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
