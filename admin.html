<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TBP Online</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .admin-card h3 { margin-top: 0; color: #00f2fe; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; color: #cbd5e1; margin-bottom: 5px; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 900px; padding: 20px 10px;">
    <h2 style="color: #fff; text-align: center; margin-bottom: 25px;">👑 Admin Control Panel</h2>

    <!-- 4️⃣ Add Balance to User Account -->
    <div class="admin-card">
      <h3>4️⃣ Add Balance to User Account</h3>
      <form id="addBalanceForm">
        <div class="form-group">
          <label>User ID / Email / UID:</label>
          <input type="text" id="targetUserId" placeholder="Ex: 583920 or user@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Amount (৳):</label>
          <input type="number" id="addAmount" step="0.01" placeholder="Ex: 500" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; background: #00f2fe; color: #000; font-weight: bold;">Add Money</button>
      </form>
    </div>

    <!-- 3️⃣ Add New Task -->
    <div class="admin-card">
      <h3>3️⃣ Add New Task</h3>
      <form id="addTaskForm">
        <div class="form-group">
          <label>Task Title:</label>
          <input type="text" id="taskTitle" placeholder="Ex: Subscribe YouTube Channel" required>
        </div>
        <div class="form-group">
          <label>Task Link:</label>
          <input type="url" id="taskLink" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>Reward Amount (৳):</label>
          <input type="number" id="taskReward" step="0.1" placeholder="Ex: 0.80" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; background: #3b82f6;">Publish Task</button>
      </form>
    </div>

    <!-- 1️⃣ Pending Deposit Requests -->
    <div class="admin-card">
      <h3>1️⃣ Pending Deposit Requests</h3>
      <div id="depositsList">
        <p style="color: var(--text-secondary);">Loading deposits...</p>
      </div>
    </div>

    <!-- 2️⃣ Pending Withdrawal Requests -->
    <div class="admin-card">
      <h3>2️⃣ Pending Withdrawal Requests</h3>
      <div id="withdrawalsList">
        <p style="color: var(--text-secondary);">Loading withdrawals...</p>
      </div>
    </div>

  </div>

  <!-- ➕ Add New Task Form -->
<div class="glass-card" style="padding: 20px; background: rgba(15, 23, 42, 0.85); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;">
  <h3 style="color: #00f2fe; margin-top: 0;">➕ Add New Task</h3>
  <form id="addTaskForm" style="display: flex; flex-direction: column; gap: 10px;">
    <input type="text" id="taskTitle" placeholder="Task Title (e.g. Visit Shortlink)" required style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;">
    
    <input type="url" id="taskLink" placeholder="Task Link (e.g. https://shrinkme.io/...)" required style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;">
    
    <select id="taskType" style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff;">
      <option value="auto">Auto Timer Task (Ad/Link)</option>
      <option value="manual">Manual Proof Task (CPA Offer/App)</option>
    </select>
    
    <textarea id="taskInstructions" placeholder="Task Instructions for Users..." required style="padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; height: 60px;"></textarea>
    
    <button type="submit" style="background: #22c55e; color: #fff; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Publish Task</button>
  </form>
</div>
  
  <script type="module" src="admin.js"></script>
</body>
</html>
