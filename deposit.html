<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deposit - TBP Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 500px; margin-top: 50px;">
    <div class="glass-card">
      <h2>Deposit Money</h2>
      <p style="color: var(--text-secondary); margin-bottom: 20px;">Send Money to: <b>01700000000</b> (bKash/Nagad/Rocket Personal)</p>
      <form id="depositForm">
        <div class="form-group">
          <label>Payment Method</label>
          <select id="method">
            <option value="bkash">bKash</option>
            <option value="nagad">Nagad</option>
            <option value="rocket">Rocket</option>
          </select>
        </div>
        <div class="form-group">
          <label>Amount (৳) [Minimum ৳100]</label>
          <input type="number" id="amount" min="100" required placeholder="100">
        </div>
        <div class="form-group">
          <label>Transaction ID (TrxID)</label>
          <input type="text" id="trxId" required placeholder="8N7X6A5S">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Submit Request</button>
      </form>
    </div>
  </div>
  <script type="module" src="deposit.js"></script>
</body>
</html>
