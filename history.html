<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction History - TBP Online</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .history-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-info p { margin: 3px 0; }
    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: capitalize;
    }
    .status-approved, .status-completed { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    .status-pending { background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; }
    .status-rejected { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    
    .tab-btn {
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab-btn.active {
      background: #00f2fe;
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 600px; padding: 20px 15px;">
    <h2 style="color: #fff; text-align: center; margin-bottom: 20px;">📜 Transaction History</h2>

    <!-- Tabs -->
    <div style="display: flex; justify-content: center; margin-bottom: 20px;">
      <button id="depTab" class="tab-btn active">Deposits</button>
      <button id="withTab" class="tab-btn">Withdrawals</button>
    </div>

    <!-- History List Container -->
    <div id="historyContainer">
      <p style="text-align: center; color: #94a3b8;">Loading history...</p>
    </div>
  </div>

  <script type="module" src="history.js"></script>
</body>
</html>
