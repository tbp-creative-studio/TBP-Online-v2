<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tasks - TBP Online</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .task-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-info h4 {
      margin: 0 0 5px 0;
      color: #fff;
    }
    .task-info p {
      margin: 0;
      font-size: 0.85rem;
      color: #00f2fe;
    }
  </style>
</head>
<body>
  <div class="container" style="padding-bottom: 50px;">
    <header>
      <div class="logo">TBP Online</div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="plans.html">VIP Plans</a>
      </nav>
    </header>

    <main style="margin-top: 25px;">
      <div style="background: rgba(0,242,254,0.1); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 1px solid #00f2fe;">
        <h3 style="margin: 0; color: #fff;">আপনার বর্তমান প্ল্যান: <span id="userPlanName" style="color: #00f2fe;">Loading...</span></h3>
        <p style="margin: 5px 0 0 0; color: #cbd5e1; font-size: 0.9rem;">
          আজকের বাকি কাজ: <b id="remainingTasks">0</b> টি | প্রতি কাজ: <b id="taskRewardText">৳0.00</b>
        </p>
      </div>

      <h3 style="color: #fff; margin-bottom: 15px;">📋 Daily Tasks</h3>
      <div id="taskList">
        <!-- JS দিয়ে টাস্ক লোড হবে -->
      </div>
    </main>
  </div>

  <script type="module" src="tasks.js"></script>
</body>
</html>
