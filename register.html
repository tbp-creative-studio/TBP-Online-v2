<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - TBP Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; margin-top: 60px;">
    <div class="glass-card">
      <h2 style="text-align: center; margin-bottom: 20px;">Create Account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required placeholder="******">
        </div>
        <div class="form-group">
          <label>Referral Code (Optional)</label>
          <input type="text" id="refCode" placeholder="Email or Code">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Register</button>
      </form>
      <p style="text-align: center; margin-top: 15px; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="color: var(--accent-cyan);">Login</a>
      </p>
    </div>
  </div>
  <script type="module" src="register.js"></script>
</body>
</html>
