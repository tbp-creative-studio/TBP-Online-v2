<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Plans - TBP Online</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .plan-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .plan-card:hover {
      transform: translateY(-5px);
      border-color: #00f2fe;
    }
    .plan-price {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00f2fe;
      margin: 10px 0;
    }
    .plan-features {
      list-style: none;
      padding: 0;
      margin: 15px 0;
      text-align: left;
      font-size: 0.95rem;
    }
    .plan-features li {
      margin-bottom: 8px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container" style="padding-bottom: 50px;">
    <header>
      <div class="logo">TBP Online</div>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="tasks.html">Tasks</a>
      </nav>
    </header>

    <main style="margin-top: 30px;">
      <h2 style="text-align: center; color: #fff;">💎 VIP Investment Plans</h2>
      <p style="text-align: center; color: var(--text-secondary);">আপনার সুবিধামত প্যাকেজ বেছে নিয়ে ইনকাম বাড়িয়ে নিন!</p>

      <div class="plans-grid" id="plansContainer">
        </div>
    </main>
  </div>

  <script type="module" src="plans.js"></script>
</body>
</html>
